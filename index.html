<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belt Wear Measurement WebApp</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.0/Recharts.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, ReferenceLine, ReferenceDot } = window.Recharts;

        // --- Helpers ---
        function extractFirstNumber(str) {
            const match = str.match(/[-+]?(?:\d*\.\d+|\d+)/);
            return match ? parseFloat(match[0]) : null;
        }

        function parseProfileFile(csvText) {
            const lines = csvText.split('\n').map(l => l.trim()).filter(l => l);
            let profileStartIdx = -1;
            for (let i = 0; i < lines.length; i++) {
                if (lines[i].toLowerCase().startsWith('"profile') || lines[i].toLowerCase().startsWith('profile')) {
                    profileStartIdx = i + 1;
                    break;
                }
            }
            if (profileStartIdx === -1) throw new Error("Could not find Profile section.");
            const values = [];
            for (let i = profileStartIdx; i < lines.length; i++) {
                const num = extractFirstNumber(lines[i]);
                if (num !== null) values.push(num);
            }
            return values;
        }

        function smoothProfile(y) {
            const n = y.length;
            let win = Math.max(51, Math.floor(n / 150));
            if (win % 2 === 0) win += 1;
            if (win >= n) win = n % 2 === 0 ? n - 1 : n - 2;
            if (win < 5) return [...y];
            const smoothed = new Array(n).fill(0);
            const halfWin = Math.floor(win / 2);
            for (let i = 0; i < n; i++) {
                let sum = 0, count = 0;
                for (let j = Math.max(0, i - halfWin); j <= Math.min(n - 1, i + halfWin); j++) {
                    sum += y[j];
                    count++;
                }
                smoothed[i] = sum / count;
            }
            return smoothed;
        }

        function findPeaks(y, minDistance) {
            let peaks = [];
            for (let i = 1; i < y.length - 1; i++) {
                if (y[i] > y[i - 1] && y[i] > y[i + 1]) {
                    peaks.push(i);
                }
            }
            let filtered = [];
            peaks.sort((a, b) => y[b] - y[a]);
            for (let p of peaks) {
                if (filtered.every(f => Math.abs(f - p) >= minDistance)) {
                    filtered.push(p);
                }
            }
            return filtered.sort((a, b) => a - b);
        }

        function getToothWidthAndCrossings(yArr, xArr, peakIdx, yLevel) {
            let leftX = null, rightX = null;
            for (let i = peakIdx; i > 0; i--) {
                if (yArr[i] >= yLevel && yArr[i - 1] < yLevel) {
                    let t = (yLevel - yArr[i-1]) / (yArr[i] - yArr[i-1]);
                    leftX = xArr[i-1] + t * (xArr[i] - xArr[i-1]);
                    break;
                }
            }
            for (let i = peakIdx; i < yArr.length - 1; i++) {
                if (yArr[i] >= yLevel && yArr[i + 1] < yLevel) {
                    let t = (yLevel - yArr[i]) / (yArr[i+1] - yArr[i]);
                    rightX = xArr[i] + t * (xArr[i+1] - xArr[i]);
                    break;
                }
            }
            if (leftX !== null && rightX !== null) {
                return { leftX, rightX, width: rightX - leftX, centerX: (leftX + rightX) / 2 };
            }
            return null;
        }

        function computeYOffset(yArr, mode, targetY) {
            if (mode === 'min') {
                return targetY - Math.min(...yArr);
            }
            let minima = [];
            for(let i=1; i<yArr.length-1; i++) {
                if(yArr[i] < yArr[i-1] && yArr[i] < yArr[i+1]) {
                    minima.push(yArr[i]);
                }
            }
            minima.sort((a,b) => a-b);
            let validMins = minima.slice(0, Math.max(1, Math.floor(minima.length * 0.1))); 
            if(validMins.length === 0) validMins = [Math.min(...yArr)];
            let meanMin = validMins.reduce((a,b)=>a+b, 0) / validMins.length;
            return targetY - meanMin;
        }

        function linearRegression(x, y) {
            const n = x.length;
            let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
            for (let i = 0; i < n; i++) {
                sumX += x[i]; sumY += y[i];
                sumXY += x[i] * y[i]; sumXX += x[i] * x[i];
            }
            const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
            const intercept = (sumY - slope * sumX) / n;
            return { slope, intercept };
        }

        const CENTERLINE_Y_LEVELS = [4000, 4500, 5000, 5500, 6000];
        const CENTERLINE_REF_Y = 5000;

        function computeCenterlineRefX(yArr, xArr, peakIdx) {
            let midpointsX = [];
            let validYLevels = [];
            for (let yLevel of CENTERLINE_Y_LEVELS) {
                let w = getToothWidthAndCrossings(yArr, xArr, peakIdx, yLevel);
                if (w) {
                    midpointsX.push(w.centerX);
                    validYLevels.push(yLevel);
                }
            }
            if (validYLevels.length < 2) return null;
            const { slope, intercept } = linearRegression(validYLevels, midpointsX);
            return slope * CENTERLINE_REF_Y + intercept;
        }

        function App() {
            const [preFile, setPreFile] = useState(null);
            const [postFile, setPostFile] = useState(null);
            const [chartData, setChartData] = useState([]);
            const [hWearAnnotations, setHWearAnnotations] = useState([]);
            const [vWearAnnotations, setVWearAnnotations] = useState([]);
            const [settings, setSettings] = useState({
                stepUm: 5.23,
                targetValleyY: 2800.0,
                alignToothNumber: 3,
                offsetMode: "mean",
                wearYLevels: "4000, 5000, 6000"
            });
            const [error, setError] = useState("");

            const handleFileUpload = async (e, type) => {
                const file = e.target.files[0];
                if (!file) return;
                const text = await file.text();
                try {
                    const parsed = parseProfileFile(text);
                    if (type === 'pre') setPreFile({ name: file.name, data: parsed });
                    else setPostFile({ name: file.name, data: parsed });
                    setError("");
                } catch (err) {
                    setError(`Error parsing ${type} file: ${err.message}`);
                }
            };

            const processFiles = () => {
                if (!preFile || !postFile) return;
                
                try {
                    const preRaw = preFile.data;
                    const postRaw = postFile.data;
                    
                    const preSmooth = smoothProfile(preRaw);
                    const postSmooth = smoothProfile(postRaw);

                    const xPre = Array.from({length: preRaw.length}, (_, i) => i * settings.stepUm);
                    const xPost = Array.from({length: postRaw.length}, (_, i) => i * settings.stepUm);

                    // 1. Y Offset
                    let preYOffset = computeYOffset(preSmooth, settings.offsetMode, settings.targetValleyY);
                    let postYOffset = computeYOffset(postSmooth, settings.offsetMode, settings.targetValleyY);
                    
                    let preYShifted = preRaw.map(v => v + preYOffset);
                    let postYShifted = postRaw.map(v => v + postYOffset);
                    
                    let preSmoothShifted = preSmooth.map(v => v + preYOffset);
                    let postSmoothShifted = postSmooth.map(v => v + postYOffset);

                    // 2. Find Peaks
                    const minDistSamples = Math.floor(1000 / settings.stepUm);
                    let prePeaks = findPeaks(preSmoothShifted, minDistSamples);
                    let postPeaks = findPeaks(postSmoothShifted, minDistSamples);

                    // 3. X Alignment (Centerline of chosen tooth)
                    const alignIdx = settings.alignToothNumber - 1;
                    let xShiftPost = 0;

                    if (prePeaks.length > alignIdx && postPeaks.length > alignIdx) {
                        let refXPre = computeCenterlineRefX(preYShifted, xPre, prePeaks[alignIdx]);
                        let refXPost = computeCenterlineRefX(postYShifted, xPost, postPeaks[alignIdx]);
                        
                        if (refXPre !== null && refXPost !== null) {
                            xShiftPost = refXPre - refXPost;
                        } else {
                            console.warn("Could not compute centerline for alignment tooth. Defaulting to peak alignment.");
                            xShiftPost = xPre[prePeaks[alignIdx]] - xPost[postPeaks[alignIdx]];
                        }
                    } else {
                        throw new Error(`Alignment tooth #${settings.alignToothNumber} not found. Pre teeth: ${prePeaks.length}, Post teeth: ${postPeaks.length}`);
                    }

                    let xPostShifted = xPost.map(x => x + xShiftPost);

                    // 4. Calculate Wear
                    const yLevels = settings.wearYLevels.split(',').map(s => parseFloat(s.trim())).filter(n => !isNaN(n));
                    let hWear = [];
                    let vWear = [];
                    let teethCount = Math.min(prePeaks.length, postPeaks.length);
                    
                    for(let t=0; t<teethCount; t++) {
                        const preP = prePeaks[t];
                        const postP = postPeaks[t];
                        
                        const pYPre = preYShifted[preP];
                        const pYPost = postYShifted[postP];
                        
                        const avgX = (xPre[preP] + xPostShifted[postP]) / 2;

                        if (pYPost !== null) {
                            vWear.push({
                                toothNum: t + 1,
                                x: avgX,
                                y: Math.max(pYPre, pYPost) + 120,
                                wear: pYPre - pYPost
                            });
                        }

                        yLevels.forEach(level => {
                            const preW = getToothWidthAndCrossings(preYShifted, xPre, preP, level);
                            const postW = getToothWidthAndCrossings(postYShifted, xPostShifted, postP, level);

                            if (preW && postW) {
                                hWear.push({
                                    toothNum: t + 1,
                                    yLevel: level,
                                    centerX: (preW.centerX + postW.centerX) / 2,
                                    wear: preW.width - postW.width,
                                    preLeft: preW.leftX,
                                    preRight: preW.rightX,
                                    postLeft: postW.leftX,
                                    postRight: postW.rightX
                                });
                            }
                        });
                    }

                    setHWearAnnotations(hWear);
                    setVWearAnnotations(vWear);

                    // 5. Build Interleaved Chart Data
                    const data = [];
                    let i = 0, j = 0;
                    const step = 4; // downsampling
                    
                    while (i < preYShifted.length || j < postYShifted.length) {
                        if (i < preYShifted.length && j < postYShifted.length) {
                            if (xPre[i] < xPostShifted[j]) {
                                data.push({ x: xPre[i], preY: preYShifted[i] });
                                i += step;
                            } else {
                                data.push({ x: xPostShifted[j], postY: postYShifted[j] });
                                j += step;
                            }
                        } else if (i < preYShifted.length) {
                            data.push({ x: xPre[i], preY: preYShifted[i] });
                            i += step;
                        } else {
                            data.push({ x: xPostShifted[j], postY: postYShifted[j] });
                            j += step;
                        }
                    }
                    
                    setChartData(data);
                    setError("");
                } catch (err) {
                    setError(`Processing Error: ${err.message}`);
                }
            };

            useEffect(() => {
                if (preFile && postFile) {
                    processFiles();
                }
            }, [preFile, postFile, settings]);

            return (
                <div className="max-w-7xl mx-auto p-6">
                    <header className="mb-8">
                        <h1 className="text-3xl font-bold text-gray-800">Belt Wear Measurement</h1>
                        <p className="text-gray-600 mt-2">Web adaptation with Centerline X-Alignment</p>
                    </header>

                    {error && (
                        <div className="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 mb-6">{error}</div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div className="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                            <h2 className="text-lg font-semibold mb-4">1. Data Input</h2>
                            <div className="mb-4">
                                <label className="block text-sm font-medium text-gray-700 mb-1">PRE-test CSV</label>
                                <input type="file" accept=".csv" onChange={(e) => handleFileUpload(e, 'pre')} className="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">POST-test CSV</label>
                                <input type="file" accept=".csv" onChange={(e) => handleFileUpload(e, 'post')} className="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-orange-50 file:text-orange-700 hover:file:bg-orange-100" />
                            </div>
                        </div>

                        <div className="bg-white p-6 rounded-lg shadow-sm border border-gray-200 md:col-span-2">
                            <h2 className="text-lg font-semibold mb-4">2. Settings</h2>
                            <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">Step (µm)</label>
                                    <input type="number" step="0.01" value={settings.stepUm} onChange={e => setSettings({...settings, stepUm: parseFloat(e.target.value)})} className="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">Target Valley Y</label>
                                    <input type="number" value={settings.targetValleyY} onChange={e => setSettings({...settings, targetValleyY: parseFloat(e.target.value)})} className="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">Align Tooth #</label>
                                    <input type="number" value={settings.alignToothNumber} onChange={e => setSettings({...settings, alignToothNumber: parseInt(e.target.value)})} className="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border" />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700">Offset Mode</label>
                                    <select value={settings.offsetMode} onChange={e => setSettings({...settings, offsetMode: e.target.value})} className="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border bg-white">
                                        <option value="mean">Mean (Average)</option>
                                        <option value="min">Min (Lowest)</option>
                                    </select>
                                </div>
                                <div className="col-span-2">
                                    <label className="block text-sm font-medium text-gray-700">Wear Y Levels (CSV)</label>
                                    <input type="text" value={settings.wearYLevels} onChange={e => setSettings({...settings, wearYLevels: e.target.value})} className="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border" placeholder="4000, 5000, 6000" />
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                        <h2 className="text-lg font-semibold mb-4">3. Wear Visualization</h2>
                        {chartData.length > 0 ? (
                            <div className="h-[600px] w-full">
                                <ResponsiveContainer width="100%" height="100%">
                                    <LineChart data={chartData} margin={{ top: 40, right: 30, left: 20, bottom: 20 }}>
                                        <CartesianGrid strokeDasharray="3 3" opacity={0.5} />
                                        <XAxis dataKey="x" type="number" label={{ value: 'X Position (µm)', position: 'insideBottom', offset: -10 }} domain={['dataMin', 'dataMax']} />
                                        <YAxis label={{ value: 'Y Position (µm)', angle: -90, position: 'insideLeft' }} domain={['auto', 'auto']} />
                                        <Tooltip formatter={(value) => value ? value.toFixed(2) : null} labelFormatter={(label) => `X: ${label.toFixed(2)}`} />
                                        <Legend verticalAlign="bottom" height={36}/>
                                        
                                        <Line type="monotone" connectNulls={true} dataKey="preY" name={`Pre: ${preFile.name}`} stroke="#3b82f6" dot={false} strokeWidth={2} isAnimationActive={false} />
                                        <Line type="monotone" connectNulls={true} dataKey="postY" name={`Post: ${postFile.name}`} stroke="#f97316" strokeDasharray="5 5" dot={false} strokeWidth={2} isAnimationActive={false} />
                                        
                                        <ReferenceLine y={settings.targetValleyY} label={{position: 'insideBottomRight', value: `y = ${settings.targetValleyY} µm`}} stroke="black" strokeDasharray="3 3" />

                                        {settings.wearYLevels.split(',').map(l => parseFloat(l)).map((level, i) => (
                                            <ReferenceLine key={`ylvl-${i}`} y={level} stroke="lightgray" strokeDasharray="3 3" />
                                        ))}

                                        {hWearAnnotations.map((h, i) => (
                                            <React.Fragment key={`h-${i}`}>
                                                <ReferenceLine segment={{x1: h.preLeft, y1: h.yLevel, x2: h.preRight, y2: h.yLevel}} stroke="#3b82f6" strokeWidth={3} />
                                                <ReferenceLine segment={{x1: h.postLeft, y1: h.yLevel, x2: h.postRight, y2: h.yLevel}} stroke="#f97316" strokeWidth={3} strokeDasharray="4 4" />
                                                <ReferenceDot x={h.centerX} y={h.yLevel} r={0} label={{ position: 'top', value: `H${h.toothNum}: ${h.wear.toFixed(1)}`, fill: 'purple', fontSize: 12, fontWeight: 'bold' }} />
                                            </React.Fragment>
                                        ))}

                                        {vWearAnnotations.map((v, i) => (
                                            <ReferenceDot key={`v-${i}`} x={v.x} y={v.y} r={0} label={{ position: 'top', value: `V${v.toothNum}: ${v.wear.toFixed(1)}`, fill: 'green', fontSize: 12, fontWeight: 'bold' }} />
                                        ))}

                                    </LineChart>
                                </ResponsiveContainer>
                            </div>
                        ) : (
                            <div className="h-96 w-full flex items-center justify-center bg-gray-50 border-2 border-dashed border-gray-200 rounded-md">
                                <p className="text-gray-500">Upload PRE and POST files to view the chart.</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
